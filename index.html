<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eafaf3">
<title>Semoga Cepat Sembuh, Serlyn 🌿</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#4a6b5e;background:linear-gradient(145deg,#eafaf3,#fdfff8 55%,#eef7ff);overflow-x:hidden}button{font:inherit;cursor:pointer}.decor{position:fixed;inset:0;overflow:hidden;pointer-events:none}.float{position:absolute;bottom:-30px;animation:up linear infinite;opacity:.65}@keyframes up{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}main{position:relative;max-width:620px;width:calc(100% - 24px);min-height:100vh;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px 0 35px}section{width:100%;text-align:center;animation:show .45s ease}@keyframes show{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.tag{display:inline-block;padding:8px 14px;background:#fff;border:1px solid #c8ecdb;border-radius:30px;color:#3f9a76;font-size:.8rem;font-weight:bold}h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.12;color:#3f7a63;margin:18px 0 12px}h1 span{color:#2fae7a}.sub{max-width:440px;margin:auto;color:#7ea093;line-height:1.7}.kitty{font-size:100px;margin:16px auto 10px;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 5px #7fbfa430)}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}.btn{border:0;border-radius:16px;padding:14px 22px;min-height:49px;font-weight:bold}.primary{background:linear-gradient(135deg,#7fdcb6,#4fc496);color:#fff;box-shadow:0 6px 0 #3aa77b,0 12px 22px #4fc49640}.secondary{background:white;color:#3f9a76;border:1px solid #c8ecdb}.btn:active{transform:translateY(3px)}.hide{display:none!important}.hint,.footer{font-size:.78rem;color:#93b0a3;margin-top:22px}.progress{width:min(100%,420px);margin:0 auto 17px;text-align:left}.pmeta{display:flex;justify-content:space-between;color:#93b0a3;font-size:.78rem;margin-bottom:8px}.track{height:8px;border-radius:20px;background:#dff3e9;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#8fe3c1,#b6e8d6);transition:width .35s}.card{background:#ffffffdf;border:2px solid white;border-radius:26px;padding:clamp(22px,6vw,36px);text-align:left;box-shadow:0 18px 50px #7fbfa41b,inset 0 0 0 1px #dff3e9}.icon{font-size:2.2rem;width:64px;height:64px;display:grid;place-items:center;border-radius:20px;background:#eafaf3;margin-bottom:16px}h2{font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;color:#3f7a63;margin:0 0 14px}.card p{font-size:1rem;line-height:1.8;color:#5e8577;margin:0 0 13px}.card strong{color:#2fae7a}.note{background:#effaf5;border:1px dashed #b3e6cd;border-radius:15px;padding:13px 15px;color:#3f9a76;line-height:1.65;font-size:.92rem;margin-top:18px}.dots{display:flex;justify-content:center;gap:7px;margin-top:18px}.dot{height:8px;width:8px;background:#dceee6;border-radius:20px}.dot.active{width:24px;background:#4fc496}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:21px}.end{text-align:center}.end .icon{margin:0 auto 18px}.end p{text-align:center}.sign{color:#2fae7a;font-weight:bold;margin-top:20px}.confetti{position:fixed;top:-20px;animation:fall 2.7s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}@media(max-width:430px){.btn{width:100%}.actions{gap:10px}.card{border-radius:22px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><div class="decor" id="decor"></div><main>
<section id="welcome"><div class="tag">✿ surat kecil untuk Serlyn ✿</div><h1>Hai, <span>Serlyn...</span> 🌿</h1><p class="sub">Aku denger kamu lagi sakit. Ada beberapa hal yang pengen aku sampaikan buat kamu. Semoga kamu mau bacanya, ya.</p><div class="kitty">🐱🌷</div><button class="btn primary" id="open">Buka suratnya, Serlyn 💚</button><div class="hint">nggak usah buru-buru bacanya ♡</div></section>
<section id="letter" class="hide" aria-live="polite"><div class="progress"><div class="pmeta"><span id="count"></span><span>pelan-pelan ya ♡</span></div><div class="track"><div class="bar" id="bar"></div></div></div><article class="card" id="card"><div id="content"></div></article><div class="dots" id="dots"></div><div class="actions"><button class="btn secondary hide" id="back">← Sebelumnya</button><button class="btn primary" id="next">Lanjut yaa 💚</button></div></section>
<div class="footer">dibuat dengan tulus, untuk Serlyn ♡</div></main>
<script>
const pages=[
{icon:"🌿",title:"Serlyn, semoga cepat sembuh ya.",text:["Aku denger kamu lagi sakit. Aku nggak bisa nengok atau nemenin langsung, tapi aku pengen kamu tahu kalau aku kepikiran dan berharap kamu cepat sembuh.","Istirahat yang cukup ya. Jangan dipaksa buat ngapa-ngapain dulu. Tubuhmu butuh waktu buat pulih, dan itu nggak apa-apa."],note:"Kesehatan kamu yang paling utama sekarang. 💚"},
{icon:"🫖",title:"Jangan lupa jaga diri",text:["Minum air yang cukup, makan yang teratur, dan jangan lupa minum obatnya kalau ada. Hal-hal kecil itu yang bantu kamu cepat pulih.","Kalau badanmu masih lemas, rebahan aja dulu. Nggak perlu ngerasa bersalah karena belum bisa ngapa-ngapain."],note:"Kamu boleh manja sedikit sekarang. Nggak apa-apa. 🤍"},
{icon:"😴",title:"Istirahat itu penting",text:["Tidur yang cukup ya, Serlyn. Kadang tubuh cuma butuh istirahat beneran buat balik lagi kuat.","Kalau butuh ditemenin ngobrol biar nggak bosen, chat aku aja. Kalau mau diem-dieman dulu juga nggak apa-apa, aku ngerti."],note:"Aku nggak mau ganggu waktu istirahatmu. Chat aja kalau kamu udah kuat. 🌙"},
{icon:"🍲",title:"Semoga lekas pulih",text:["Aku beneran berharap kamu cepat sembuh. Semoga besok-besok badanmu udah lebih enak, demamnya turun, dan kamu bisa balik ceria lagi.","Sampai kamu pulih, jangan mikirin yang berat-berat dulu. Fokus ke diri kamu sendiri ya."],note:"Doa kecilku buat kamu: semoga cepat sehat lagi. 🌱"},
{icon:"💚",title:"Cepat sembuh ya, Serlyn",text:["Makasih ya udah mau baca sampai sini. Sekali lagi, semoga cepat sembuh. Aku tunggu kabar baiknya.","Kalau kamu udah baikan dan mau cerita-cerita, chat aku ya. Aku siap dengerin, kapan pun kamu siap."],note:"Jaga diri baik-baik ya, Serlyn. Semoga sehat selalu. 💗"}];
let i=0;const $=x=>document.getElementById(x);
function render(){let p=pages[i];$("count").textContent=`Pesan ${i+1} dari ${pages.length}`;$("bar").style.width=((i+1)/pages.length*100)+"%";$("back").classList.toggle("hide",i===0);$("next").textContent=i===pages.length-1?"Selesaikan surat 💚":"Lanjut yaa 💚";$("content").innerHTML=`<div class="icon">${p.icon}</div><h2>${p.title}</h2>${p.text.map(t=>`<p>${t}</p>`).join("")}<div class="note">${p.note}</div>`;$("dots").innerHTML=pages.map((_,n)=>`<span class="dot ${n===i?"active":""}"></span>`).join("");$("next").onclick=next}
function next(){if(i<pages.length-1){i++;render()}else ending()}
function ending(){$("count").textContent="Surat selesai dibaca";$("bar").style.width="100%";$("back").classList.add("hide");$("content").innerHTML=`<div class="end"><div class="icon">🐱</div><h2>Semoga Cepat Sembuh, Serlyn. 🌿💚</h2><p>Aku denger kamu lagi sakit. Aku beneran berharap kamu cepat sembuh dan balik ceria lagi.</p><p>Istirahat yang cukup, jangan lupa makan dan minum obatnya. Nggak perlu mikirin yang berat-berat dulu.</p><p><strong>Kalau udah baikan, chat aku ya. Aku tunggu kabar baiknya.</strong></p><div class="sign">Dari aku, yang selalu berharap kamu sehat ♡</div></div>`;$("next").textContent="Baca lagi dari awal ↻";$("next").onclick=()=>{i=0;render()};for(let n=0;n<24;n++){let e=document.createElement("span");e.className="confetti";e.textContent=["💚","🌿","🌸","🤍","✨"][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+"vw";e.style.fontSize=(14+Math.random()*14)+"px";e.style.animationDelay=Math.random()+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
$("open").onclick=()=>{$("welcome").classList.add("hide");$("letter").classList.remove("hide");i=0;render();window.scrollTo({top:0,behavior:"smooth"})};$("next").onclick=next;$("back").onclick=()=>{if(i>0){i--;render()}};
for(let n=0;n<17;n++){let e=document.createElement("span");e.className="float";e.textContent=["♡","✦","✿","🌿","✨"][n%5];e.style.left=Math.random()*100+"%";e.style.fontSize=(13+Math.random()*15)+"px";e.style.animationDuration=(12+Math.random()*13)+"s";e.style.animationDelay=(-Math.random()*20)+"s";$("decor").appendChild(e)}
</script></body></html>
